<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Church Quiz</title>

<style>
body{
font-family:Tahoma,Arial;
background:#f4f4f4;
margin:0;
padding:20px;
}
.container{
max-width:700px;
margin:auto;
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}
input,button{
width:100%;
padding:12px;
margin:8px 0;
font-size:16px;
}
button{
background:#6c2bd9;
color:white;
border:none;
cursor:pointer;
}
h1,h2{
text-align:center;
}
.hidden{
display:none;
}
</style>
</head>
<body>

<div class="container">

<h1>Church Quiz</h1>

<div id="joinSection">
<h2>دخول المسابقة</h2>

<input id="playerName" placeholder="الاسم">

<input id="playerCode" placeholder="الكود الشخصي">

<button onclick="joinQuiz()">دخول</button>

</div>

<div id="quizSection" class="hidden">

<h2 id="questionTitle"></h2>

<div id="answers"></div>

</div>

<div id="resultSection" class="hidden">

<h2>تم إرسال الإجابة ✅</h2>

</div>

</div>

<script>
const SUPABASE_URL="https://qwcwtssxipgxmopatqkd.supabase.co";
const SUPABASE_KEY="sb_publishable_-_MjRcRzURBkvzvdY-kj8A_mYnfSsZ4";

async function joinQuiz(){

const playerName=document.getElementById("playerName").value;
const playerCode=document.getElementById("playerCode").value;

if(!playerName || !playerCode){
alert("اكتب الاسم والكود");
return;
}

alert("تم تسجيل الدخول بنجاح");

document.getElementById("joinSection").classList.add("hidden");
document.getElementById("quizSection").classList.remove("hidden");

document.getElementById("questionTitle").innerText=
"المحبة حسب الدرس هي؟";

document.getElementById("answers").innerHTML=`
<button onclick="submitAnswer()">شعور مؤقت</button>
<button onclick="submitAnswer()">سلوك واختيار</button>
<button onclick="submitAnswer()">كلام جميل فقط</button>
<button onclick="submitAnswer()">مساعدة الأصدقاء فقط</button>
`;
}

function submitAnswer(){

document.getElementById("quizSection").classList.add("hidden");
document.getElementById("resultSection").classList.remove("hidden");

}
</script>

</body>
</html>
