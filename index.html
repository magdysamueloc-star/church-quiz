<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Church Quiz</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',Tahoma,sans-serif;
}

body{
background:linear-gradient(135deg,#46178f,#864cbf);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.card{
background:white;
width:100%;
max-width:500px;
padding:30px;
border-radius:25px;
box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.logo{
text-align:center;
font-size:36px;
margin-bottom:10px;
}

.title{
text-align:center;
font-size:28px;
font-weight:bold;
margin-bottom:8px;
}

.subtitle{
text-align:center;
color:#666;
margin-bottom:25px;
}

input{
width:100%;
padding:15px;
margin-top:12px;
border:2px solid #e5e5e5;
border-radius:12px;
font-size:16px;
}

input:focus{
outline:none;
border-color:#864cbf;
}

button{
width:100%;
padding:15px;
margin-top:15px;
background:#6b21a8;
color:white;
border:none;
border-radius:12px;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#581c87;
}

.success{
margin-top:20px;
padding:15px;
background:#dcfce7;
color:#166534;
border-radius:12px;
display:none;
text-align:center;
}

.error{
margin-top:20px;
padding:15px;
background:#fee2e2;
color:#991b1b;
border-radius:12px;
display:none;
text-align:center;
}

.footer{
margin-top:20px;
text-align:center;
font-size:13px;
color:#888;
}
</style>
</head>

<body>

<div class="card">

<div class="logo">⛪</div>

<div class="title">Church Quiz</div>

<div class="subtitle">
مسابقات مدارس الأحد
</div>

<input
id="name"
placeholder="الاسم بالكامل">

<input
id="code"
placeholder="الكود الشخصي">

<button onclick="joinQuiz()">
دخول المسابقة
</button>

<button onclick="createRoom()"
style="
background:#111827;
margin-top:10px;
">
إنشاء غرفة للخادم
</button>


<div id="success" class="success"></div>

<div id="error" class="error"></div>

<div class="footer">
Church Quiz © 2026
</div>

</div>

<script>

const SUPABASE_URL =
"https://qwcwtssxipgxmopatqkd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_-_MjRcRzURBkvzvdY-kj8A_mYnfSsZ4";

const client =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);
async function createRoom(){

const pin =
Math.floor(
100000 + Math.random() * 900000
).toString();

const { error } =
await client
.from("quiz_rooms")
.insert([
{
pin: pin,
title: "Church Quiz",
status: "waiting"
}
]);

if(error){

alert(error.message);
return;
}

alert("PIN : " + pin);

localStorage.setItem(
"church_host_pin",
pin
);

}
async function joinQuiz(){

document.getElementById("success").style.display="none";
document.getElementById("error").style.display="none";

const name =
document.getElementById("name").value.trim();

const code =
document.getElementById("code").value.trim();

if(!name || !code){

showError("يرجى إدخال الاسم والكود");

return;
}

try{

const { data , error } =
await client
.from("temp_players")
.insert([
{
name:name,
student_code:code,
score:0
}
]);

if(error){

showError(error.message);
return;
}

showSuccess(
"تم تسجيل الدخول بنجاح ✅"
);

localStorage.setItem(
"church_player_name",
name
);

localStorage.setItem(
"church_player_code",
code
);

}
catch(ex){

showError(
"حدث خطأ أثناء الحفظ"
);

}

}

function showSuccess(msg){

const element =
document.getElementById("success");

element.innerHTML=msg;

element.style.display="block";
}

function showError(msg){

const element =
document.getElementById("error");

element.innerHTML=msg;

element.style.display="block";
}

</script>

</body>
</html>
