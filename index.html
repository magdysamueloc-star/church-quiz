<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مسابقة المحبة Live</title><script src="/socket.io/socket.io.js"></script><style>
:root{--p:#5b28c8;--p2:#32106f;--bg:#f5f2ff;--card:#fff;--green:#15803d}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:linear-gradient(135deg,var(--p2),var(--p));min-height:100vh;color:#19132b}.wrap{max-width:1050px;margin:auto;padding:24px}.hero{color:white;text-align:center;padding:22px}.hero h1{font-size:clamp(28px,5vw,54px);margin:0}.card{background:var(--card);border-radius:22px;padding:24px;box-shadow:0 16px 45px #1b073f66;margin:18px auto;max-width:760px}input,button{font:inherit;border-radius:12px;padding:14px;border:2px solid #ddd;width:100%;margin:7px 0}button{background:var(--p);color:#fff;border:0;font-weight:bold;cursor:pointer}button.alt{background:#111827}.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice button{min-height:92px;font-size:18px}.choice button:nth-child(1){background:#dc2626}.choice button:nth-child(2){background:#2563eb}.choice button:nth-child(3){background:#d97706}.choice button:nth-child(4){background:#15803d}.hide{display:none}.pin{font-size:42px;font-weight:bold;letter-spacing:8px;color:var(--p);text-align:center}.board{list-style:none;padding:0}.board li{display:flex;justify-content:space-between;background:#f2effb;padding:12px 16px;border-radius:12px;margin:7px 0}.tabs{display:flex;gap:10px}.tabs button{width:auto;flex:1}.note{background:#fff7d6;border:1px solid #ead274;padding:12px;border-radius:12px}.status{text-align:center;font-weight:bold;color:var(--green)}@media(max-width:600px){.choice{grid-template-columns:1fr}.wrap{padding:10px}.card{padding:16px}}
</style></head><body><div class="wrap"><div class="hero"><h1>💜 مسابقة المحبة</h1><p>اختبار مباشر وتفاعلي للدرس الثالث</p></div>
<div id="home" class="card"><div class="tabs"><button onclick="show('player')">دخول لاعب</button><button class="alt" onclick="show('admin')">دخول الخادم</button></div><div class="note">كل مخدوم لازم يدخل بالكود الشخصي الذي استلمه منك. الكود يُستخدم مرة واحدة فقط، لذلك لا يمكنه التجربة باسم وهمي ثم الرجوع باسمه.</div></div>
<div id="player" class="card hide"><h2>دخول المسابقة</h2><input id="pin" maxlength="6" placeholder="PIN المسابقة"><input id="pname" placeholder="اسمك الحقيقي"><input id="scode" placeholder="الكود الشخصي السري"><button onclick="join()">ادخل المسابقة</button><p id="perr"></p></div>
<div id="admin" class="card hide"><h2>لوحة الخادم</h2><input id="apass" type="password" placeholder="كلمة مرور الخادم"><button onclick="login()">تسجيل الدخول</button><p id="aerr"></p></div>
<div id="lobby" class="card hide"><h2 id="rtitle">غرفة المسابقة</h2><div id="pinbox" class="pin"></div><p class="status" id="lstatus">في انتظار بدء المسابقة...</p><button id="startbtn" class="hide" onclick="startGame()">ابدأ الآن</button><ul id="players" class="board"></ul></div>
<div id="quiz" class="card hide"><div id="counter"></div><h2 id="question"></h2><div id="choices" class="choice"></div><p id="answerStatus" class="status"></p><button id="nextbtn" class="hide" onclick="nextQuestion()">السؤال التالي</button></div>
<div id="finish" class="card hide"><h2>🏆 النتيجة النهائية</h2><ul id="finalboard" class="board"></ul><button id="reportbtn" class="hide" onclick="downloadReport()">تنزيل تقرير CSV</button></div></div>
<script>
const socket=io();let role='',roomId='',playerId='',current=-1,isAdmin=false,state=null;
function show(id){['home','player','admin','lobby','quiz','finish'].forEach(x=>document.getElementById(x).classList.add('hide'));document.getElementById(id).classList.remove('hide')}
async function post(url,data){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw Error(j.error||'حدث خطأ');return j}
async function login(){try{await post('/api/admin/login',{password:apass.value});isAdmin=true;role='admin';const r=await post('/api/rooms',{title:'اختبار الدرس الثالث: المحبة'});roomId=r.id;pinbox.textContent=r.pin;startbtn.classList.remove('hide');show('lobby');socket.emit('watchRoom',roomId)}catch(e){aerr.textContent=e.message}}
async function join(){try{const r=await post('/api/join',{pin:pin.value,name:pname.value,studentCode:scode.value});role='player';playerId=r.playerId;roomId=r.roomId;pinbox.textContent=pin.value;show('lobby');socket.emit('watchRoom',roomId)}catch(e){perr.textContent=e.message}}
async function startGame(){await post('/api/rooms/'+roomId+'/start',{})}async function nextQuestion(){await post('/api/rooms/'+roomId+'/next',{})}
socket.on('roomState',s=>{state=s;renderBoard(s.players);if(s.room.status==='finished'){show('finish');renderFinal(s.players);return}if(s.room.status==='playing'&&s.question){show('quiz');renderQuestion(s.question)}else{show('lobby')}});
function renderBoard(ps){players.innerHTML=ps.map((p,i)=>`<li><span>${i+1}. ${esc(p.name)}</span><b>${p.score}</b></li>`).join('')}
function renderFinal(ps){finalboard.innerHTML=ps.map((p,i)=>`<li><span>${i<3?['🥇','🥈','🥉'][i]:i+1} ${esc(p.name)}</span><b>${p.score}</b></li>`).join('');if(isAdmin)reportbtn.classList.remove('hide')}
function renderQuestion(q){if(current!==q.index){current=q.index;answerStatus.textContent='';choices.innerHTML=q.a.map((x,i)=>`<button onclick="answer(${i})">${esc(x)}</button>`).join('')}counter.textContent=`السؤال ${q.index+1} من ${q.total}`;question.textContent=q.q;nextbtn.classList.toggle('hide',!isAdmin)}
async function answer(i){if(role!=='player')return;try{const r=await post('/api/answer',{playerId,questionIdx:current,answerIdx:i});answerStatus.textContent=r.correct?'✅ إجابة صحيحة':'❌ تم تسجيل الإجابة';[...choices.children].forEach(b=>b.disabled=true)}catch(e){answerStatus.textContent=e.message}}
async function downloadReport(){const r=await fetch('/api/rooms/'+roomId+'/report');const d=await r.json();const csv='الاسم,الكود,الدرجة,عدد الإجابات,الصحيح\n'+d.map(x=>[x.name,x.student_code,x.score,x.answered,x.correct].join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='نتائج_مسابقة_المحبة.csv';a.click()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
</script></body></html>
